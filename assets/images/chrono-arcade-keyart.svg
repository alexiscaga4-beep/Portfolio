<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="synthBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150824"/>
      <stop offset="50%" stop-color="#210C35"/>
      <stop offset="100%" stop-color="#0B0314"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="50%" stop-color="#FF2A85"/>
      <stop offset="100%" stop-color="#7A00FF"/>
    </linearGradient>
    <linearGradient id="chromeText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#A5E7FF"/>
      <stop offset="52%" stop-color="#002F54"/>
      <stop offset="100%" stop-color="#E89FFF"/>
    </linearGradient>
    <filter id="synthShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#FF2A85" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#synthBg)"/>

  <!-- Left: Content & Specs -->
  <g transform="translate(100, 140)">
    <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FF2A85" letter-spacing="4">CASE STUDY 04 // GAMING &amp; STREAM IDENTITY</text>
    <text x="0" y="85" font-family="'Anton', sans-serif" font-size="58" fill="#FFFFFF" letter-spacing="2">CHRONO ARCADE</text>
    <text x="0" y="145" font-family="'Anton', sans-serif" font-size="58" fill="#00F0FF" letter-spacing="2">SYNTHWAVE SUITE</text>

    <text x="0" y="200" font-family="'Space Grotesk', sans-serif" font-size="15" fill="#C8B3DC" width="380">
      <tspan x="0" dy="0">High-octane visual package for a retro-futurist indie arcade title.</tspan>
      <tspan x="0" dy="24">Produced dynamic Twitch stream overlays, animated tournament</tspan>
      <tspan x="0" dy="24">scoreboards, holographic badges, and poster prints.</tspan>
    </text>

    <!-- Color Palette -->
    <g transform="translate(0, 290)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A58ABF" letter-spacing="2">NEON CHROMATIC SPECS</text>
      
      <rect x="0" y="15" width="60" height="60" rx="8" fill="#FF2A85"/>
      <text x="0" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FF2A85">#FF2A85</text>
      <text x="0" y="103" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#8869A6">Laser Magenta</text>

      <rect x="75" y="15" width="60" height="60" rx="8" fill="#00F0FF"/>
      <text x="75" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00F0FF">#00F0FF</text>
      <text x="75" y="103" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#8869A6">Cyan Pulse</text>

      <rect x="150" y="15" width="60" height="60" rx="8" fill="#FFDD00"/>
      <text x="150" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFDD00">#FFDD00</text>
      <text x="150" y="103" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#8869A6">Solar Amber</text>

      <rect x="225" y="15" width="60" height="60" rx="8" fill="#150824" stroke="rgba(255,255,255,0.2)"/>
      <text x="225" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C8B3DC">#150824</text>
      <text x="225" y="103" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#8869A6">Deep Arcade</text>
    </g>

    <!-- Scope Breakdown -->
    <g transform="translate(0, 440)">
      <rect width="360" height="150" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
      <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00F0FF" letter-spacing="2">PACKAGE DELIVERABLES</text>
      
      <text x="20" y="65" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#FFFFFF">• 4K Twitch Stream Overlays &amp; Alerts</text>
      <text x="20" y="92" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#FFFFFF">• Custom Vector Pixel Glyphs &amp; Badges</text>
      <text x="20" y="119" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#FFFFFF">• Physical Promotional Foil Event Posters</text>
    </g>
  </g>

  <!-- Right: Synthwave Artwork Showcase Card -->
  <g transform="translate(620, 110)">
    <rect width="480" height="660" rx="16" fill="#1B0C2E" stroke="#3F1D65" stroke-width="2" filter="url(#synthShadow)"/>

    <!-- Perspective Grid (Arcade floor) -->
    <g stroke="#FF2A85" stroke-width="1.5" opacity="0.4">
      <line x1="240" y1="360" x2="0" y2="660"/>
      <line x1="240" y1="360" x2="80" y2="660"/>
      <line x1="240" y1="360" x2="160" y2="660"/>
      <line x1="240" y1="360" x2="240" y2="660"/>
      <line x1="240" y1="360" x2="320" y2="660"/>
      <line x1="240" y1="360" x2="400" y2="660"/>
      <line x1="240" y1="360" x2="480" y2="660"/>

      <line x1="0" y1="400" x2="480" y2="400"/>
      <line x1="0" y1="440" x2="480" y2="440"/>
      <line x1="0" y1="490" x2="480" y2="490"/>
      <line x1="0" y1="560" x2="480" y2="560"/>
      <line x1="0" y1="640" x2="480" y2="640"/>
    </g>

    <!-- Retro Glowing Sun -->
    <circle cx="240" cy="270" r="100" fill="url(#sunGrad)"/>
    <g stroke="#1B0C2E" stroke-width="4">
      <line x1="140" y1="270" x2="340" y2="270"/>
      <line x1="140" y1="285" x2="340" y2="285"/>
      <line x1="140" y1="305" x2="340" y2="305"/>
      <line x1="140" y1="330" x2="340" y2="330"/>
    </g>

    <!-- Mountain wireframe silhouette -->
    <polygon points="40,360 140,250 220,360" fill="#0B0314" stroke="#00F0FF" stroke-width="2"/>
    <polygon points="200,360 300,220 420,360" fill="#0B0314" stroke="#FF2A85" stroke-width="2"/>

    <!-- Chrome Title Typography -->
    <g transform="translate(240, 420)">
      <text x="0" y="0" font-family="'Anton', sans-serif" font-size="44" fill="url(#chromeText)" text-anchor="middle" letter-spacing="4">CHRONO ARCADE</text>
      <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00F0FF" text-anchor="middle" letter-spacing="6">1 9 8 4  E D I T I O N</text>
    </g>

    <!-- UI Overlay Stream Elements -->
    <g transform="translate(40, 520)">
      <rect width="400" height="90" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.1)"/>
      <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FF2A85">● LIVE STREAM BROADCAST</text>
      <text x="380" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00F0FF" text-anchor="end">FPS: 120 // 4K UHD</text>

      <text x="20" y="65" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#FFFFFF">CURRENT LEADERBOARD: 984,200 PTS</text>
    </g>
  </g>
</svg>
