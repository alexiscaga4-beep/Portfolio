<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121815"/>
      <stop offset="50%" stop-color="#1A241F"/>
      <stop offset="100%" stop-color="#0E1310"/>
    </linearGradient>
    <linearGradient id="tagPaper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBE6DC"/>
      <stop offset="100%" stop-color="#DDD6C7"/>
    </linearGradient>
    <filter id="hangtagShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="15" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#ecoBg)"/>

  <!-- Technical Grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="900"/>
    <line x1="1120" y1="0" x2="1120" y2="900"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="820" x2="1200" y2="820"/>
  </g>

  <!-- Left: Branding Narrative & Specs -->
  <g transform="translate(100, 140)">
    <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#74A882" letter-spacing="4">CASE STUDY 03 // SUSTAINABLE APPAREL</text>
    <text x="0" y="85" font-family="'Anton', sans-serif" font-size="58" fill="#F4EFE6" letter-spacing="2">AETHEL APPAREL</text>
    <text x="0" y="145" font-family="'Anton', sans-serif" font-size="58" fill="#74A882" letter-spacing="2">VISUAL REBRAND</text>

    <text x="0" y="200" font-family="'Space Grotesk', sans-serif" font-size="15" fill="#ADB8B0" width="380">
      <tspan x="0" dy="0">Holistic brand identity for an ethical streetwear label.</tspan>
      <tspan x="0" dy="24">Focus on raw macro textures, unbleached cotton hangtags,</tspan>
      <tspan x="0" dy="24">recycled packaging, and minimal geometric logomark.</tspan>
    </text>

    <!-- Color Palette Chips -->
    <g transform="translate(0, 290)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7E8E82" letter-spacing="2">SUSTAINABLE PALETTE</text>
      
      <rect x="0" y="15" width="60" height="60" rx="8" fill="#2E4036"/>
      <text x="0" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#74A882">#2E4036</text>
      <text x="0" y="103" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#66786A">Deep Pine</text>

      <rect x="75" y="15" width="60" height="60" rx="8" fill="#EBE6DC"/>
      <text x="75" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#DDD6C7">#EBE6DC</text>
      <text x="75" y="103" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#66786A">Raw Cotton</text>

      <rect x="150" y="15" width="60" height="60" rx="8" fill="#A3937B"/>
      <text x="150" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A3937B">#A3937B</text>
      <text x="150" y="103" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#66786A">Clay Taupe</text>

      <rect x="225" y="15" width="60" height="60" rx="8" fill="#1C211E"/>
      <text x="225" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ADB8B0">#1C211E</text>
      <text x="225" y="103" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#66786A">Charcoal</text>
    </g>

    <!-- Eco Icons Block -->
    <g transform="translate(0, 440)">
      <rect width="360" height="150" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
      <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#74A882" letter-spacing="2">PACKAGING DELIVERABLES</text>
      
      <text x="20" y="65" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F4EFE6">• 100% Post-Consumer Recycled Hangtags</text>
      <text x="20" y="92" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F4EFE6">• Soy-Based Ink Typography &amp; Care Labels</text>
      <text x="20" y="119" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F4EFE6">• Organic Cotton Woven Neck Brand Tags</text>
    </g>
  </g>

  <!-- Right: Apparel Hangtag Mockup Presentation -->
  <g transform="translate(680, 110)">
    <!-- Natural Twine Cord -->
    <path d="M 180 30 Q 170 120 180 180" stroke="#B8A78F" stroke-width="4" fill="none"/>
    <circle cx="180" cy="180" r="10" fill="#4A4035"/>
    <circle cx="180" cy="180" r="5" fill="#1A241F"/>

    <!-- Hangtag 1: Raw Paper Tag -->
    <g transform="translate(50, 130)" filter="url(#hangtagShadow)">
      <rect width="260" height="460" rx="12" fill="url(#tagPaper)"/>
      
      <!-- Tag Inner Border -->
      <rect x="12" y="12" width="236" height="436" rx="8" fill="none" stroke="#CCC2AE" stroke-width="1"/>

      <!-- Eyelet -->
      <circle cx="130" cy="40" r="14" fill="#3A3025"/>
      <circle cx="130" cy="40" r="8" fill="#1A241F"/>

      <!-- Brand Logo Emblem -->
      <g transform="translate(130, 130)">
        <polygon points="0,-35 30,25 -30,25" fill="#2E4036"/>
        <circle cx="0" cy="5" r="8" fill="#EBE6DC"/>
      </g>

      <text x="130" y="210" font-family="'Anton', sans-serif" font-size="34" fill="#1A211D" text-anchor="middle" letter-spacing="2">AETHEL</text>
      <text x="130" y="235" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5E6B62" text-anchor="middle" letter-spacing="3">SUSTAINABLE GOODS</text>

      <line x1="40" y1="260" x2="220" y2="260" stroke="#CCC2AE" stroke-width="1"/>

      <g font-family="'Space Grotesk', sans-serif" font-size="11" fill="#3D4A41" text-anchor="middle">
        <text x="130" y="295" font-weight="600">ORGANIC HEAVYWEIGHT TEE</text>
        <text x="130" y="320" fill="#6D7B71">100% COMBED ORGANIC COTTON</text>
        <text x="130" y="342" fill="#6D7B71">GOTS &amp; FAIR TRADE CERTIFIED</text>
      </g>

      <!-- Price & Barcode -->
      <g transform="translate(50, 380)">
        <text x="0" y="25" font-family="'Anton', sans-serif" font-size="24" fill="#1A211D">$68.00</text>
        <text x="160" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7E8E82" text-anchor="end">SIZE: LARGE</text>
        <text x="160" y="30" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7E8E82" text-anchor="end">LOT: 2026-F</text>
      </g>
    </g>

    <!-- Hangtag 2 (Offset Behind: Dark Forest Green) -->
    <g transform="translate(200, 200) rotate(14)" filter="url(#hangtagShadow)">
      <rect width="200" height="340" rx="10" fill="#2E4036"/>
      <circle cx="100" cy="30" r="10" fill="#EBE6DC" opacity="0.6"/>
      <circle cx="100" cy="30" r="5" fill="#1A241F"/>
      
      <text x="100" y="120" font-family="'Anton', sans-serif" font-size="24" fill="#EBE6DC" text-anchor="middle" letter-spacing="2">ROOTED IN NATURE</text>
      <text x="100" y="160" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#74A882" text-anchor="middle">CIRCULAR DESIGN</text>
      <text x="100" y="180" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#74A882" text-anchor="middle">ZERO PLASTIC</text>
    </g>
  </g>
</svg>
