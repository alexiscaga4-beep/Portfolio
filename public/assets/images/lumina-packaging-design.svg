<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="lumiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121315"/>
      <stop offset="50%" stop-color="#1A1B1F"/>
      <stop offset="100%" stop-color="#0E0F11"/>
    </linearGradient>
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#542B0E"/>
      <stop offset="35%" stop-color="#8F4B19"/>
      <stop offset="65%" stop-color="#AA5E26"/>
      <stop offset="85%" stop-color="#6E3812"/>
      <stop offset="100%" stop-color="#3D1E07"/>
    </linearGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="50%" stop-color="#DFB15B"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="bottleShadow" x="-30%" y="-10%" width="160%" height="140%">
      <feDropShadow dx="15" dy="30" stdDeviation="35" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#lumiBg)"/>

  <!-- Left: Project Narrative & Design Specs -->
  <g transform="translate(100, 140)">
    <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#DFB15B" letter-spacing="4">CASE STUDY 06 // PACKAGING &amp; PRODUCT DESIGN</text>
    <text x="0" y="85" font-family="'Anton', sans-serif" font-size="58" fill="#FFFFFF" letter-spacing="2">LUMINA BOTANICALS</text>
    <text x="0" y="145" font-family="'Anton', sans-serif" font-size="58" fill="#DFB15B" letter-spacing="2">LUXURY PACKAGING</text>

    <text x="0" y="200" font-family="'Space Grotesk', sans-serif" font-size="15" fill="#A8AAB2" width="380">
      <tspan x="0" dy="0">Minimalist organic skincare line featuring custom amber glass</tspan>
      <tspan x="0" dy="24">bottles, Swiss typographic layout, tactile embossed paper boxes,</tspan>
      <tspan x="0" dy="24">and premium gold foil stamping.</tspan>
    </text>

    <!-- Palette -->
    <g transform="translate(0, 290)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7E808A" letter-spacing="2">MATERIAL &amp; COLOR MATRIX</text>
      
      <rect x="0" y="15" width="60" height="60" rx="8" fill="#8F4B19"/>
      <text x="0" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#DFB15B">#8F4B19</text>
      <text x="0" y="103" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#676973">Amber Glass</text>

      <rect x="75" y="15" width="60" height="60" rx="8" fill="#DFB15B"/>
      <text x="75" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#DFB15B">#DFB15B</text>
      <text x="75" y="103" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#676973">Foil Stamp</text>

      <rect x="150" y="15" width="60" height="60" rx="8" fill="#F4F4F0"/>
      <text x="150" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F4F4F0">#F4F4F0</text>
      <text x="150" y="103" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#676973">Cotton Paper</text>

      <rect x="225" y="15" width="60" height="60" rx="8" fill="#1C1D21"/>
      <text x="225" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A8AAB2">#1C1D21</text>
      <text x="225" y="103" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#676973">Matte Black</text>
    </g>

    <!-- Package Deliverables -->
    <g transform="translate(0, 440)">
      <rect width="360" height="150" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#DFB15B" letter-spacing="2">PACKAGING SYSTEM</text>
      
      <text x="20" y="65" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#FFFFFF">• 30ml Apothecary Dropper Bottle Label Spec</text>
      <text x="20" y="92" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#FFFFFF">• 100% Cotton Fiber Embossed Outer Box Sleeve</text>
      <text x="20" y="119" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#FFFFFF">• Foil-Stamped Batch Authentication Seals</text>
    </g>
  </g>

  <!-- Right: 3D Cosmetic Bottle & Box Mockup -->
  <g transform="translate(680, 130)">
    <!-- Outer Product Box Mockup -->
    <g transform="translate(20, 60)" filter="url(#bottleShadow)">
      <rect width="210" height="520" rx="6" fill="#F4F4F0"/>
      <rect x="10" y="10" width="190" height="500" fill="none" stroke="#E2E2DC" stroke-width="1"/>

      <!-- Embossed Brand Foil -->
      <text x="105" y="90" font-family="'Anton', sans-serif" font-size="28" fill="url(#goldFoil)" text-anchor="middle" letter-spacing="3">LUMINA</text>
      <text x="105" y="115" font-family="'JetBrains Mono', monospace" font-size="9" fill="#75756C" text-anchor="middle" letter-spacing="3">BOTANICAL SCIENCE</text>

      <line x1="45" y1="135" x2="165" y2="135" stroke="#DFB15B" stroke-width="1"/>

      <text x="105" y="175" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#1C1D21" text-anchor="middle" font-weight="600">RESTORATIVE SERUM</text>
      <text x="105" y="195" font-family="'JetBrains Mono', monospace" font-size="9" fill="#75756C" text-anchor="middle">FORMULA NO. 07</text>

      <text x="105" y="470" font-family="'JetBrains Mono', monospace" font-size="9" fill="#75756C" text-anchor="middle">1.0 FL. OZ. / 30 ML e</text>
    </g>

    <!-- Glass Dropper Bottle (Overlapping in Front) -->
    <g transform="translate(180, 140)" filter="url(#bottleShadow)">
      <!-- Rubber Pipette Bulb -->
      <path d="M 65 30 Q 85 10 105 30 L 105 50 L 65 50 Z" fill="#1A1A1E"/>
      <!-- Gold Collar Ring -->
      <rect x="60" y="50" width="50" height="24" rx="2" fill="url(#goldFoil)"/>
      <rect x="62" y="74" width="46" height="8" fill="#111114"/>

      <!-- Bottle Neck -->
      <rect x="68" y="82" width="34" height="20" fill="url(#amberGlass)"/>

      <!-- Main Bottle Body -->
      <rect x="25" y="102" width="120" height="340" rx="24" fill="url(#amberGlass)"/>
      
      <!-- Glass Highlight Reflection -->
      <path d="M 40 120 L 40 420" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round"/>
      <path d="M 130 120 L 130 420" stroke="rgba(0,0,0,0.5)" stroke-width="6" stroke-linecap="round"/>

      <!-- Bottle Front Label -->
      <rect x="35" y="170" width="100" height="190" rx="4" fill="#F4F4F0"/>
      <text x="85" y="210" font-family="'Anton', sans-serif" font-size="18" fill="#1C1D21" text-anchor="middle" letter-spacing="1">LUMINA</text>
      <text x="85" y="225" font-family="'JetBrains Mono', monospace" font-size="7" fill="#75756C" text-anchor="middle" letter-spacing="2">SERUM 07</text>

      <line x1="45" y1="238" x2="125" y2="238" stroke="#DFB15B" stroke-width="1"/>

      <text x="85" y="260" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#1C1D21" text-anchor="middle">SQUALANE + C</text>
      <text x="85" y="275" font-family="'JetBrains Mono', monospace" font-size="7" fill="#75756C" text-anchor="middle">ACTIVE COMPLEX</text>
      
      <circle cx="85" cy="315" r="10" fill="url(#goldFoil)"/>
      <polygon points="85,309 89,316 81,316" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
