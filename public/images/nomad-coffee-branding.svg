<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="50%" stop-color="#1E1915"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#241E1A"/>
      <stop offset="40%" stop-color="#322B25"/>
      <stop offset="70%" stop-color="#2B231D"/>
      <stop offset="100%" stop-color="#1A1512"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#E8DFD3"/>
    </linearGradient>
    <linearGradient id="accentTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="100%" stop-color="#C85A3D"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="pouchShadow" x="-20%" y="-10%" width="150%" height="140%">
      <feDropShadow dx="15" dy="35" stdDeviation="40" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>

  <!-- Subtle Studio Grid / Blueprint lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="900"/>
    <line x1="1120" y1="0" x2="1120" y2="900"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="820" x2="1200" y2="820"/>
    <line x1="600" y1="0" x2="600" y2="900" stroke-dasharray="4,6"/>
  </g>

  <!-- Top Metadata Bar -->
  <g font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" fill="#8E857C" letter-spacing="3">
    <text x="90" y="60">CASE STUDY 01 // BRAND ARCHITECTURE</text>
    <text x="1110" y="60" text-anchor="end">YEAR: 2026 // PACKAGING &amp; IDENTITY</text>
  </g>

  <!-- Left: Brand Identity Board -->
  <g transform="translate(100, 130)">
    <!-- Brand Title -->
    <text x="0" y="45" font-family="'Anton', sans-serif" font-size="64" fill="#F5EFE6" letter-spacing="2">NOMAD COFFEE</text>
    <text x="0" y="75" font-family="'JetBrains Mono', monospace" font-size="14" fill="#E07A5F" letter-spacing="4">SPECIALTY ROASTERS &amp; PROVISIONS</text>

    <text x="0" y="125" font-family="'Space Grotesk', sans-serif" font-size="15" fill="#B5ADA3" width="400">
      <tspan x="0" dy="0">Complete visual identity system for artisanal single-origin</tspan>
      <tspan x="0" dy="24">coffee roasters. Crafted with tactile foil textures,</tspan>
      <tspan x="0" dy="24">editorial typography, and sustainable kraft packaging.</tspan>
    </text>

    <!-- Color Palette Chips -->
    <g transform="translate(0, 230)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8E857C" letter-spacing="2">PALETTE // CHROMATIC SPECIFICATION</text>
      
      <!-- Chip 1 -->
      <rect x="0" y="16" width="65" height="65" rx="8" fill="#E07A5F" filter="url(#cardShadow)"/>
      <text x="0" y="96" font-family="'JetBrains Mono', monospace" font-size="10" fill="#B5ADA3">#E07A5F</text>
      <text x="0" y="110" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#6E6760">Terracotta</text>

      <!-- Chip 2 -->
      <rect x="80" y="16" width="65" height="65" rx="8" fill="#241E1A" stroke="rgba(255,255,255,0.1)" filter="url(#cardShadow)"/>
      <text x="80" y="96" font-family="'JetBrains Mono', monospace" font-size="10" fill="#B5ADA3">#241E1A</text>
      <text x="80" y="110" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#6E6760">Espresso</text>

      <!-- Chip 3 -->
      <rect x="160" y="16" width="65" height="65" rx="8" fill="#F5EFE6" filter="url(#cardShadow)"/>
      <text x="160" y="96" font-family="'JetBrains Mono', monospace" font-size="10" fill="#B5ADA3">#F5EFE6</text>
      <text x="160" y="110" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#6E6760">Warm Cream</text>

      <!-- Chip 4 -->
      <rect x="240" y="16" width="65" height="65" rx="8" fill="#5F7161" filter="url(#cardShadow)"/>
      <text x="240" y="96" font-family="'JetBrains Mono', monospace" font-size="10" fill="#B5ADA3">#5F7161</text>
      <text x="240" y="110" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#6E6760">Sage Olive</text>
    </g>

    <!-- Typography Specimen Card -->
    <g transform="translate(0, 410)">
      <rect width="360" height="170" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="25" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E07A5F" letter-spacing="2">TYPOGRAPHY HIERARCHY</text>
      <text x="25" y="70" font-family="'Anton', sans-serif" font-size="32" fill="#F5EFE6" letter-spacing="1">CANELA SERIF &amp; GROTESK</text>
      <text x="25" y="105" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#B5ADA3">Aa Bb Cc Dd Ee Ff Gg Hh Ii Jj 0123456789</text>
      <text x="25" y="135" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6E6760">TAGLINE // ELEVATED TASTE &amp; ETHICAL SOURCING</text>
    </g>
  </g>

  <!-- Right: 3D Coffee Packaging Pouch Mockup -->
  <g transform="translate(680, 140)">
    <!-- Background Shadow -->
    <ellipse cx="200" cy="620" rx="190" ry="25" fill="#000000" opacity="0.6" filter="url(#cardShadow)"/>

    <!-- Pouch Body -->
    <path d="M 70 80 Q 200 65 330 80 L 360 580 Q 200 620 40 580 Z" fill="url(#pouchGrad)" filter="url(#pouchShadow)"/>

    <!-- Pouch Top Seal with Ziploc indent -->
    <path d="M 65 50 Q 200 40 335 50 L 330 85 Q 200 70 70 85 Z" fill="#2B231D"/>
    <line x1="75" y1="67" x2="325" y2="67" stroke="#3D342C" stroke-width="2" stroke-dasharray="2,3"/>

    <!-- Pouch Texture Highlights -->
    <path d="M 75 90 Q 200 75 140 570" stroke="rgba(255,255,255,0.06)" stroke-width="4" fill="none"/>
    <path d="M 320 90 Q 210 75 270 570" stroke="rgba(0,0,0,0.4)" stroke-width="6" fill="none"/>

    <!-- Pouch Front Label -->
    <g transform="translate(100, 180)">
      <rect width="200" height="310" rx="6" fill="url(#labelGrad)" filter="url(#cardShadow)"/>
      <rect x="8" y="8" width="184" height="294" fill="none" stroke="#D1C4B2" stroke-width="1"/>

      <!-- Label Details -->
      <text x="100" y="45" font-family="'JetBrains Mono', monospace" font-size="9" fill="#C85A3D" text-anchor="middle" letter-spacing="3">ETHIOPIA YIRGACHEFFE</text>
      
      <!-- Label Emblem -->
      <circle cx="100" cy="85" r="22" fill="#E07A5F"/>
      <polygon points="100,72 108,86 100,100 92,86" fill="#F5EFE6"/>

      <text x="100" y="140" font-family="'Anton', sans-serif" font-size="28" fill="#1C1815" text-anchor="middle" letter-spacing="1">NOMAD</text>
      <text x="100" y="160" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#665B51" text-anchor="middle" letter-spacing="2">SINGLE ORIGIN LOT #42</text>
      
      <line x1="30" y1="180" x2="170" y2="180" stroke="#D1C4B2" stroke-width="1"/>

      <!-- Tasting Notes -->
      <g font-family="'Space Grotesk', sans-serif" font-size="10" fill="#241E1A" text-anchor="middle">
        <text x="100" y="205" font-weight="600">NOTES: JASMINE • BERGAMOT • HONEY</text>
        <text x="100" y="228" fill="#756A5E">ELEVATION: 2,100M // WASHED PROCESS</text>
        <text x="100" y="250" fill="#756A5E">ROAST PROFILE: LIGHT-MEDIUM</text>
      </g>

      <!-- Barcode / Weight -->
      <rect x="35" y="270" width="130" height="16" fill="#1C1815"/>
      <line x1="50" y1="270" x2="50" y2="286" stroke="#F5EFE6" stroke-width="2"/>
      <line x1="60" y1="270" x2="60" y2="286" stroke="#F5EFE6" stroke-width="4"/>
      <line x1="75" y1="270" x2="75" y2="286" stroke="#F5EFE6" stroke-width="1"/>
      <line x1="90" y1="270" x2="90" y2="286" stroke="#F5EFE6" stroke-width="3"/>
      <line x1="110" y1="270" x2="110" y2="286" stroke="#F5EFE6" stroke-width="2"/>
      <line x1="125" y1="270" x2="125" y2="286" stroke="#F5EFE6" stroke-width="5"/>
      <line x1="145" y1="270" x2="145" y2="286" stroke="#F5EFE6" stroke-width="2"/>
    </g>

    <!-- Side Floating Business Card Mockup -->
    <g transform="translate(240, 480) rotate(-12)">
      <rect width="180" height="110" rx="8" fill="#E07A5F" filter="url(#cardShadow)"/>
      <text x="20" y="35" font-family="'Anton', sans-serif" font-size="18" fill="#F5EFE6">NOMAD COFFEE</text>
      <text x="20" y="55" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F5EFE6" opacity="0.8">ROASTERY &amp; TASTING ROOM</text>
      <text x="20" y="90" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#F5EFE6">HELLO@NOMADCOFFEE.IO</text>
    </g>
  </g>

  <!-- Bottom Accent / Watermark -->
  <g transform="translate(100, 830)" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5E5852">
    <text x="0" y="0">ALEXIS DENIEL CAGA — GRAPHIC DESIGN &amp; BRAND IDENTITY PORTFOLIO</text>
    <text x="1020" y="0" text-anchor="end">DESIGN SPEC: 01 / PACKAGING</text>
  </g>
</svg>
